# 依赖按 ADR-0001 基线，在对应任务开始时逐个加入，避免声明未使用的依赖。
# P0-01 需要：async-imap / async-native-tls / tokio / futures / thiserror / tracing
# P0-02 需要：mail-parser / ammonia
# P0-03 需要：rusqlite
# P0-04 需要：tauri / tauri-build / serde / serde_json

[package]
name = "dp-gmail"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
publish = false
description = "本地优先跨平台桌面邮件客户端"

# 移动端（Android）要求把同一份库同时编成 cdylib（给 JNI 用）、
# staticlib 与 rlib（给桌面与测试用）。缺这一段时 `tauri android build`
# 会报 `Library artifact not found ... libdp_gmail.so`。
[lib]
name = "dp_gmail"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 框架。命令桥只做参数校验和转发（DESIGN.md P0-04 约束）。
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# IMAP 协议。默认 feature 是 runtime-async-std，本项目用 tokio，必须关闭默认值。
# 注意 1：0.12 已移除 async_imap::connect，改为自行建流后 Client::new()。
# 注意 2：runtime-tokio 下它用的是 tokio 的 io trait，不要接 futures-io 兼容层。
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
# TLS 适配层**按平台二选一**，见文件末尾的 target 段与 ADR-0006 §9.6。
# MIME 解析。full_encoding 打开 encoding_rs，用于 unknown-8bit 等非标准编码兜底。
mail-parser = { version = "0.11", features = ["full_encoding"] }
# HTML 净化。净化属安全代码，不自造实现（AGENTS.md 禁止项）。
ammonia = "4"
# SQLite。bundled 在本地编译 SQLite，FTS5 默认已启用（P1 用），无需额外 crate。
# 禁止用 ORM（DESIGN.md P0-03 约束），一律手写 SQL + 事务。
rusqlite = { version = "0.40", features = ["bundled"] }
# 凭证加密（P0-07）。方案见 docs/adr/ADR-0002。
# 禁止 ECB；禁止硬编码密钥（AGENTS.md 禁止项）。
aes-gcm = "0.11"
# 密钥材料用后清零，避免残留内存。
zeroize = { version = "1", features = ["derive"] }
# 密钥文件（版本化 JSON）的 base64 编解码。async-imap 已传递依赖此版本。
base64 = "0.23"
# SMTP 发信（P2）：lettre。选它而非手写 SMTP —— EHLO/STARTTLS/AUTH/MIME 组装的
# 边界情况极多，手写必然出错。**lettre 的依赖声明在文件末尾的 target 段**，
# 因为它的 TLS 后端要按平台二选一。决策记录见 ADR-0003 与 ADR-0006 §9.6。
# 附件文件选择对话框（P2-01g）。Tauri v2 的文件选择必须走插件 ——
# webview 的 <input type="file"> 拿不到真实路径，而后端按路径读附件。
tauri-plugin-dialog = "2"
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tracing = "0.1"

# ── 构建产物体积 ────────────────────────────────────────────────
# 背景：2026-10-17 实测 `target/` 涨到 22.72 GB，其中 debug 占 20.49 GB。
# 原因不是代码大，而是 `tests/` 下 28 个集成测试二进制在 debug 下**各自完整链接
# 整棵依赖树**，并各自生成调试符号 —— 光 `deps` 里就有 80 个 >100 MB 的 .pdb。
#
# 两条改动都**不影响功能**，只影响调试信息与符号：
#   debug = 1    只要行号表，不要变量/类型信息（崩溃回溯仍有文件:行号）
#   strip = true 正式产物在链接后剥掉符号，exe 更小
# 若日后需要完整调试，把 debug 改回 2 即可。

[profile.dev]
debug = 1

[profile.release]
strip = true

# ── TLS：按平台二选一（ADR-0006 §9.6，方案 C3）────────────────────
# 桌面走 native-tls（Windows 上是 SChannel，系统自带）—— 已真机验证 8 家全通。
# Android 走 rustls —— 因为 native-tls 在安卓会退回 OpenSSL，而 Windows 上
# 编不出 Android 版 OpenSSL（OpenSSL 的 Configure 要求宿主 perl 给 Unix 路径）。
#
# 已知代价：**安卓上 sina 的 IMAP 连不上**。它的服务器只提供 TLS1.2 的
# 有限域 DHE / 纯 RSA 密钥交换，rustls 只做 ECDHE + TLS1.3。

[target.'cfg(not(target_os = "android"))'.dependencies]
# 默认 feature 是 runtime-smol；本项目用 tokio，runtime-tokio 下产出 tokio 流，
# 与 async-imap 的 runtime-tokio 直接对接，不需要兼容层。
async-native-tls = { version = "0.6", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11", features = ["tokio1-native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
# 只启用 ring 作为密码学后端：默认的 aws-lc-rs 需要 cmake + NASM，本机没有。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# 根证书用 Mozilla 静态包，不读系统信任库（安卓读系统库要走 JNI）。
webpki-roots = "0.26"
# **必须 default-features = false**：lettre 默认 feature 含 native-tls，
# 留着它换 rustls 就白换（编译期会直接报「同时启用了 native-tls 与 rustls」）。
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "pool",
    "hostname",
    "builder",
    "tokio1-rustls-tls",
] }

